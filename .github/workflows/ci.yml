name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.24.x
          - stable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Install protobuf compiler libraries
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev libprotoc-dev protobuf-compiler
      - run: go test ./...

  no-cgo:
    name: No CGO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - run: CGO_ENABLED=0 go test ./...

  quality:
    name: Vet and race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Install protobuf compiler libraries
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev libprotoc-dev protobuf-compiler
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=1 go test -race ./...

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Verify generated code
        run: |
          ./test/pc/generate.sh
          git diff --exit-code -- test/pc/test.pc.go test/pc/test.pc-ex.go
